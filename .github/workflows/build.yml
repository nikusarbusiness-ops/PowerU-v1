
name: poweru v1.1

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Package Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Find and Prepare plugin.yml
        shell: bash
        run: |
          set -euo pipefail

          test -f pom.xml || {
            echo "ERROR: pom.xml missing!"
            exit 1
          }

          mapfile -t FILES < <(
            find . \
              -type f \
              -name plugin.yml \
              -not -path './.git/*' \
              -not -path './target/*'
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "ERROR: No plugin.yml found anywhere!"
            find . -maxdepth 5 -type f
            exit 1
          fi

          if [ "${#FILES[@]}" -gt 1 ]; then
            echo "ERROR: Multiple plugin.yml files found!"
            printf '%s\n' "${FILES[@]}"
            exit 1
          fi

          mkdir -p src/main/resources
          cp "${FILES[0]}" src/main/resources/plugin.yml

          echo "plugin.yml successfully prepared!"
          cat src/main/resources/plugin.yml

      - name: Build Plugin
        run: mvn -B -U clean verify

      - name: Validate JAR
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t JARS < <(
            find target -maxdepth 1 -type f -name "*.jar" \
              ! -name "original-*.jar" \
              ! -name "*-sources.jar" \
              ! -name "*-javadoc.jar"
          )

          if [ "${#JARS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one JAR!"
            exit 1
          fi

          JAR="${JARS[0]}"

          jar tf "$JAR" | grep -Fxq "plugin.yml" || {
            echo "ERROR: plugin.yml missing inside JAR!"
            exit 1
          }

          MAIN_CLASS=$(sed -n 's/^main:[[:space:]]*//p' \
            src/main/resources/plugin.yml | head -n 1 | tr -d "\"'")

          if [ -z "$MAIN_CLASS" ]; then
            echo "ERROR: Main class missing!"
            exit 1
          fi

          MAIN_PATH=$(echo "$MAIN_CLASS" | tr '.' '/')

          jar tf "$JAR" | grep -Fxq "${MAIN_PATH}.class" || {
            echo "ERROR: Main class missing inside JAR!"
            exit 1
          }

          echo "JAR validation successful!"

      - name: Prepare Final JAR
        run: |
          mkdir -p dist
          cp "${JARS[0]}" dist/Power.jar

      - name: Upload Final JAR
        uses: actions/upload-artifact@v7
        with:
          name: Power-Plugin
          path: dist/Power.jar
          if-no-files-found: error
          retention-days: 30
