
name: Build Power Plugin

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Validate Power.jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Detect Project Directory
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t POMS < <(
            find . -name pom.xml -not -path '*/target/*' \
              -not -path '*/.git/*'
          )

          if [ "${#POMS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one pom.xml!"
            printf '%s\n' "${POMS[@]}"
            exit 1
          fi

          PROJECT_DIR=$(dirname "${POMS[0]}")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

          test -f "$PROJECT_DIR/src/main/resources/plugin.yml"
          test -f "$PROJECT_DIR/src/main/java/de/power/Power.java"

      - name: Build with Maven
        run: mvn -B clean package
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Validate Plugin
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          JAR="target/Power.jar"

          if [ ! -s "$JAR" ]; then
            echo "ERROR: Power.jar was not generated!"
            exit 1
          fi

          echo "Checking plugin.yml..."
          jar tf "$JAR" | grep -Fx "plugin.yml"

          echo "Checking main class..."
          jar tf "$JAR" | grep -Fx "de/power/Power.class"

          echo "Checking compiled package..."
          jar tf "$JAR" | grep '^de/power/'

          echo "All checks passed!"

      - name: Prepare Final Artifact
        run: |
          mkdir -p dist
          cp "$PROJECT_DIR/target/Power.jar" dist/Power.jar

          test -s dist/Power.jar

      - name: Upload Power.jar
        uses: actions/upload-artifact@v4
        with:
          name: Power-Plugin
          path: dist/Power.jar
          if-no-files-found: error
          retention-days: 30
