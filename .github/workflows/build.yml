
name: Build Power Plugin

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Validate Power.jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Prepare Maven Project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p src/main/java src/main/resources

          # Java-Dateien in die Maven-Struktur übernehmen
          find . -maxdepth 1 -name '*.java' -exec cp {} src/main/java/ \;

          # Plugin-Konfiguration übernehmen
          test -f plugin.yml
          cp plugin.yml src/main/resources/plugin.yml

          echo "Java files:"
          find src/main/java -name '*.java'

          echo "Plugin configuration:"
          test -s src/main/resources/plugin.yml

      - name: Build with Maven
        run: mvn -B -U clean package

      - name: Validate Power.jar
        shell: bash
        run: |
          set -euo pipefail

          JAR="target/Power.jar"

          test -s "$JAR"

          echo "Checking plugin.yml..."
          jar tf "$JAR" | grep -Fx "plugin.yml"

          echo "Checking main class..."
          jar tf "$JAR" | grep -Fx "de/power/Power.class"

          echo "Checking compiled classes..."
          jar tf "$JAR" | grep '^de/power/'

          echo "Power.jar successfully validated!"

      - name: Prepare Artifact
        run: |
          mkdir -p dist
          cp target/Power.jar dist/Power.jar

      - name: Upload Power.jar
        uses: actions/upload-artifact@v4
        with:
          name: Power-Plugin
          path: dist/Power.jar
          if-no-files-found: error
          retention-days: 30
