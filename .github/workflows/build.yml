
name: Build Power Plugin

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Power Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Prepare Source Files
        shell: bash
        run: |
          mkdir -p src/main/java
          mkdir -p src/main/resources

          # Java-Dateien aus dem Hauptverzeichnis übernehmen
          find . -maxdepth 1 -type f -name "*.java" \
            -exec cp {} src/main/java/ \;

          # plugin.yml übernehmen
          if [ -f plugin.yml ]; then
            cp plugin.yml src/main/resources/plugin.yml
          fi

          # Weitere YAML-Dateien übernehmen
          for file in config.yml messages.yml; do
            if [ -f "$file" ]; then
              cp "$file" src/main/resources/
            fi
          done

          # Sprachdateien übernehmen
          if [ -d lang ]; then
            mkdir -p src/main/resources/lang
            cp -r lang/. src/main/resources/lang/
          fi

          echo "Java-Dateien:"
          find src/main/java -type f -name "*.java" | wc -l

          test -f src/main/resources/plugin.yml
          test -n "$(find src/main/java -type f -name '*.java' -print -quit)"

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress -U clean package

      - name: Verify JAR
        shell: bash
        run: |
          test -f target/Power.jar
          jar tf target/Power.jar | grep -q "plugin.yml"
          echo "Power.jar erfolgreich erstellt."

      - name: Create Source ZIP
        run: |
          zip -r Power-Source.zip . \
            -x ".git/*" \
            -x "target/*" \
            -x ".github/*"

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: Power-Plugin-JAR
          path: target/Power.jar
          if-no-files-found: error

      - name: Upload Source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Power-Source
          path: Power-Source.zip
          if-no-files-found: error
